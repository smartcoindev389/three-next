version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/html/www.platformz.us
file_exists_behavior: OVERWRITE
hooks:
  AfterInstall:
    - location: scripts/deploy_react.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/pm2_restart.sh
      timeout: 300
      runas: root
